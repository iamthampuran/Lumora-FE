<div class="flex h-screen bg-[#FDFBF9] font-sans overflow-hidden text-gray-900">
  <main class="flex-1 flex flex-col h-full overflow-y-auto px-6 py-10 md:px-12">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h2 class="text-3xl font-serif text-gray-900 mb-1">Events</h2>
        <p class="text-sm text-gray-500">
          Manage your photography projects from planning to delivery.
        </p>
      </div>
      <button
        class="bg-[#C45A3E] hover:bg-[#b04a2e] text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-sm flex items-center justify-center gap-2 transition-colors cursor-pointer"
        (click)="goToCreateEvent()"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
        </svg>
        Create New Event
      </button>
    </header>

    <!-- Tabs & Filter Bar -->
    <div class="mb-8">
      <div class="flex border-b border-gray-200 mb-6">
        <button
          (click)="setTab(eventStatus.Created)"
          class="px-6 py-3 text-sm font-medium transition-colors border-b-2 cursor-pointer"
          [class.text-[#CF6B4E]]="activeTab() === eventStatus.Created"
          [class.border-[#CF6B4E]]="activeTab() === eventStatus.Created"
          [class.text-gray-500]="activeTab() !== eventStatus.Created"
          [class.border-transparent]="activeTab() !== eventStatus.Created"
        >
          Created
        </button>
        <button
          (click)="setTab(eventStatus.InProgress)"
          class="px-6 py-3 text-sm font-medium transition-colors border-b-2 cursor-pointer"
          [class.text-[#CF6B4E]]="activeTab() === eventStatus.InProgress"
          [class.border-[#CF6B4E]]="activeTab() === eventStatus.InProgress"
          [class.text-gray-500]="activeTab() !== eventStatus.InProgress"
          [class.border-transparent]="activeTab() !== eventStatus.InProgress"
        >
          Active
        </button>
        <button
          (click)="setTab(eventStatus.Complete)"
          class="px-6 py-3 text-sm font-medium transition-colors border-b-2 cursor-pointer"
          [class.text-[#CF6B4E]]="activeTab() === eventStatus.Complete"
          [class.border-[#CF6B4E]]="activeTab() === eventStatus.Complete"
          [class.text-gray-500]="activeTab() !== eventStatus.Complete"
          [class.border-transparent]="activeTab() !== eventStatus.Complete"
        >
          Completed
        </button>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 justify-between">
        <div class="relative w-full max-w-md">
          <svg
            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          <!-- Using the event to bind input so child gets changes via signal -->
          <input
            type="text"
            [value]="searchQuery() || ''"
            (input)="onSearchInput($event)"
            placeholder="Search events by title or location..."
            class="w-full pl-9 pr-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:ring-1 focus:ring-[#CF6B4E] outline-none"
          />
        </div>
        <button
          (click)="openFilterPanel()"
          class="flex items-center justify-center gap-2 px-5 py-2.5 border border-gray-200 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            ></path>
          </svg>
          Filter
        </button>
      </div>
    </div>

    <!-- The newly extracted child component -->
    <app-list-event-data [tabStatus]="activeTab()" [searchQuery]="searchQuery()" [activeFilters]="activeFilters()">
    </app-list-event-data>
  </main>
@if (isFilterPanelOpen()) {
    <app-event-filter
      [isClosing]="isFilterClosing()"
      [initialFilters]="activeFilters()" 
      (closePanel)="closeFilterPanel()"
      (applyFilters)="applyFilters($event)">
    </app-event-filter>
  }
</div>
