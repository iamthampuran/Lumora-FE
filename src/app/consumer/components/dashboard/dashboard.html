<div class="flex h-screen bg-[#FDFBF9] font-sans overflow-hidden">

  <app-consumer-sidebar />

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">

    <app-consumer-topbar />

    <!-- Scrollable Body -->
    <div class="p-8 pb-12 max-w-7xl mx-auto w-full">

      <!-- Welcome & CTA -->
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
          <h2 class="text-2xl font-serif text-gray-900 mb-1 flex items-center gap-2">
            Welcome back, Consumer! <span>&#128075;</span>
          </h2>
          <p class="text-sm text-gray-500">Here's what's happening with your events.</p>
        </div>
        <button class="bg-[#C45A3E] hover:bg-[#b04a2e] text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-sm flex items-center gap-2 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
          Create New Event
        </button>
      </div>

      <!-- Stats Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Draft Card -->
        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
          <div class="w-12 h-12 rounded-full bg-orange-50 text-[#CF6B4E] flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900">2</p>
            <p class="text-sm font-semibold text-gray-900">Draft Events</p>
            <p class="text-[11px] text-gray-500">Continue planning your events</p>
          </div>
        </div>

        <!-- Active Card -->
        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
          <div class="w-12 h-12 rounded-full bg-green-50 text-green-600 flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900">3</p>
            <p class="text-sm font-semibold text-gray-900">Active Events</p>
            <p class="text-[11px] text-gray-500">Events in progress</p>
          </div>
        </div>

        <!-- Completed Card -->
        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
          <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900">4</p>
            <p class="text-sm font-semibold text-gray-900">Completed Events</p>
            <p class="text-[11px] text-gray-500">Successfully completed</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <app-event-tabs [events]="events" class="lg:col-span-2"></app-event-tabs>

        <!-- Recent Activity (1/3 width) -->
        <app-consumer-recent-activity />

      </div>

      <!-- Footer -->
      <footer class="mt-12 flex items-center gap-6 text-[11px] text-gray-400 border-t border-gray-100 pt-6">
        <p>&copy; 2025 Lumora. All rights reserved.</p>
        <a href="#" class="hover:text-gray-600">Terms of Service</a>
        <a href="#" class="hover:text-gray-600">Privacy Policy</a>
      </footer>

    </div>
  </main>
</div>
