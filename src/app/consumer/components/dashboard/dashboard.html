<div class="flex h-screen bg-[#FDFBF9] font-sans overflow-hidden">

  <app-consumer-sidebar />

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">

    <app-consumer-topbar />

    <!-- Scrollable Body -->
    <div class="p-8 pb-12 max-w-7xl mx-auto w-full">

      <!-- Welcome & CTA -->
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
          <h2 class="text-2xl font-serif text-gray-900 mb-1 flex items-center gap-2">
            Welcome back, Consumer! <span>&#128075;</span>
          </h2>
          <p class="text-sm text-gray-500">Here's what's happening with your events.</p>
        </div>
        <button class="bg-[#C45A3E] hover:bg-[#b04a2e] text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-sm flex items-center gap-2 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
          Create New Event
        </button>
      </div>

      <app-dashboard-stats-row [stats]="stats()"></app-dashboard-stats-row>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <app-event-tabs
          [actualEvents]="eventsFetched()"
          (statusChanged)="getEventDetails($event)"
          class="lg:col-span-2">
        </app-event-tabs>

        <!-- Recent Activity (1/3 width) -->
        <app-consumer-recent-activity />

      </div>

      <!-- Footer -->
      <footer class="mt-12 flex items-center gap-6 text-[11px] text-gray-400 border-t border-gray-100 pt-6">
        <p>&copy; 2025 Lumora. All rights reserved.</p>
        <a href="#" class="hover:text-gray-600">Terms of Service</a>
        <a href="#" class="hover:text-gray-600">Privacy Policy</a>
      </footer>

    </div>
  </main>
</div>
