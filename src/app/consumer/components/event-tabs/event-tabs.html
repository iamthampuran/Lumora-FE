        <!-- Events Panel (2/3 width) -->
        <div class="lg:col-span-2 bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden flex flex-col">

          <!-- Tabs Navigation -->
          <div class="flex border-b border-gray-100 px-2">
            <button
              (click)="setActiveTab('draft')"
              class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
              [class.text-[#CF6B4E]]="activeTab() === 'draft'"
              [class.border-[#CF6B4E]]="activeTab() === 'draft'"
              [class.text-gray-500]="activeTab() !== 'draft'"
              [class.border-transparent]="activeTab() !== 'draft'"
            >
              Draft Events
            </button>
            <button
              (click)="setActiveTab('active')"
              class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
              [class.text-[#CF6B4E]]="activeTab() === 'active'"
              [class.border-[#CF6B4E]]="activeTab() === 'active'"
              [class.text-gray-500]="activeTab() !== 'active'"
              [class.border-transparent]="activeTab() !== 'active'"
            >
              Active Events
            </button>
            <button
              (click)="setActiveTab('completed')"
              class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
              [class.text-[#CF6B4E]]="activeTab() === 'completed'"
              [class.border-[#CF6B4E]]="activeTab() === 'completed'"
              [class.text-gray-500]="activeTab() !== 'completed'"
              [class.border-transparent]="activeTab() !== 'completed'"
            >
              Completed Events
            </button>
          </div>

          <!-- List Header -->
          <div class="p-6 flex justify-between items-center border-b border-gray-50">
            <p class="text-sm text-gray-600">Events you're planning. Keep going!</p>
            <button class="flex items-center gap-2 text-sm text-gray-600 border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
              Latest updated
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </button>
          </div>

          <!-- Events List -->
          <div class="p-6 space-y-4 flex-1">
            @for (event of events; track event.id) {
              <div class="border border-gray-100 rounded-xl p-5 flex flex-col md:flex-row md:items-center gap-5 hover:border-orange-200 transition-colors">
                <div class="w-16 h-16 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center shrink-0 text-gray-400">
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div class="flex-1">
                  <div class="flex items-center gap-3 mb-1">
                    <h3 class="font-bold text-gray-900 text-sm">{{ event.title }}</h3>
                    <span class="px-2 py-0.5 bg-orange-50 text-orange-700 text-[10px] font-bold rounded uppercase tracking-wider">{{ event.status }}</span>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-gray-500 mb-3">
                    <span class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>{{ event.date }}</span>
                    <span class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path></svg>{{ event.location }}</span>
                    <span class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>{{ event.duration }}</span>
                  </div>
                  <p class="text-[11px] text-gray-400">Last updated {{ event.updated }}</p>
                </div>
                <div class="flex items-center gap-3">
                  <button class="px-4 py-2 border border-[#CF6B4E] text-[#CF6B4E] font-medium text-xs rounded-lg hover:bg-orange-50 transition-colors whitespace-nowrap">
                    Continue Planning
                  </button>
                  <button class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-50 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                  </button>
                </div>
              </div>
            }
          </div>

          <!-- Pagination -->
          <div class="p-4 border-t border-gray-100 flex justify-center items-center gap-1">
            <button class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-900 rounded-md"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg></button>
            <button class="w-8 h-8 flex items-center justify-center border border-[#CF6B4E] text-[#CF6B4E] rounded-md text-sm font-medium">1</button>
            <button class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-50 rounded-md text-sm font-medium">2</button>
            <button class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-900 rounded-md"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg></button>
          </div>
        </div>
