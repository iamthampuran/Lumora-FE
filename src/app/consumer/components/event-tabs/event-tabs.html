<!-- Events Panel (2/3 width) -->
<div
  class="lg:col-span-2 bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden flex flex-col"
>
  <!-- Tabs Navigation -->
  <div class="flex border-b border-gray-100 px-2">
    <button
      (click)="setActiveTab(eventStatus.Created)"
      class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
      [class.text-[#CF6B4E]]="activeTab() === eventStatus.Created"
      [class.border-[#CF6B4E]]="activeTab() === eventStatus.Created"
      [class.text-gray-500]="activeTab() !== eventStatus.Created"
      [class.border-transparent]="activeTab() !== eventStatus.Created"
    >
      Created Events
    </button>
    <button
      (click)="setActiveTab(eventStatus.InProgress)"
      class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
      [class.text-[#CF6B4E]]="activeTab() === eventStatus.InProgress"
      [class.border-[#CF6B4E]]="activeTab() === eventStatus.InProgress"
      [class.text-gray-500]="activeTab() !== eventStatus.InProgress"
      [class.border-transparent]="activeTab() !== eventStatus.InProgress"
    >
      Active Events
    </button>
    <button
      (click)="setActiveTab(eventStatus.Complete)"
      class="px-6 py-4 text-sm font-medium transition-colors border-b-2 cursor-pointer"
      [class.text-[#CF6B4E]]="activeTab() === eventStatus.Complete"
      [class.border-[#CF6B4E]]="activeTab() === eventStatus.Complete"
      [class.text-gray-500]="activeTab() !== eventStatus.Complete"
      [class.border-transparent]="activeTab() !== eventStatus.Complete"
    >
      Completed Events
    </button>
  </div>

  <!-- List Header -->
  <div class="p-6 flex justify-between items-center border-b border-gray-50">
    <p class="text-sm text-gray-600">{{ getHeaderText() }}</p>
    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide">Last updated</p>
  </div>

  <!-- Events List -->
  <div class="p-6 space-y-4 flex-1">
    @for (event of mappedEvents(); track event.id) {
      <div
        class="border border-gray-100 rounded-xl p-5 flex flex-col md:flex-row md:items-center gap-5 hover:border-orange-200 transition-colors"
      >
        <div
          class="w-16 h-16 rounded-xl border border-gray-100 flex items-center justify-center shrink-0"
          [class.bg-orange-50]="isCreatedTab()"
          [class.text-orange-600]="isCreatedTab()"
          [class.bg-green-50]="isActiveTab()"
          [class.text-green-600]="isActiveTab()"
          [class.bg-purple-50]="isCompletedTab()"
          [class.text-purple-600]="isCompletedTab()"
        >
          @if (isCompletedTab()) {
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0"
              ></path>
            </svg>
          } @else {
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
          }
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-3 mb-1">
            <h3 class="font-bold text-gray-900 text-sm">{{ event.title }}</h3>
            <span
              class="px-2 py-0.5 text-[10px] font-bold rounded uppercase tracking-wider"
              [class]="getStatusBadgeClasses()"
              >{{ getStatusLabel() }}</span
            >
          </div>
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-gray-500 mb-3">
            <span class="flex items-center gap-1.5"
              ><svg
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                ></path></svg
              >{{ event.dateLabel }}</span
            >
            <span class="flex items-center gap-1.5 cursor-help" [title]="event.fullLocationLabel">
              <svg
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"
                ></path>
              </svg>
              {{ event.locationLabel }}
            </span>
            <span class="flex items-center gap-1.5"
              ><svg
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path></svg
              >{{ event.durationLabel }}</span
            >
          </div>
          <p class="text-[11px] text-gray-400">Last updated {{ event.updatedLabel }}</p>
        </div>
        <div class="flex items-center gap-3">
          <button
            class="px-4 py-2 border font-medium text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer"
            [class]="getPrimaryButtonClasses()"
            (click)="goToDetailsPage(event.id)"
          >
            {{ getPrimaryActionLabel() }}
          </button>
          <button
            class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-50 rounded-lg cursor-pointer"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</div>
