<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
  <!-- Draft Card -->
  <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
    <div class="w-12 h-12 rounded-full bg-orange-50 text-[#CF6B4E] flex items-center justify-center shrink-0">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    </div>
    <div>
      <p class="text-2xl font-bold text-gray-900">{{ stats().createdCount }}</p>
      <p class="text-sm font-semibold text-gray-900">Draft Events</p>
      <p class="text-[11px] text-gray-500">Continue planning your events</p>
    </div>
  </div>

  <!-- Active Card -->
  <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
    <div class="w-12 h-12 rounded-full bg-green-50 text-green-600 flex items-center justify-center shrink-0">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
    </div>
    <div>
      <p class="text-2xl font-bold text-gray-900">{{ stats().activeCount }}</p>
      <p class="text-sm font-semibold text-gray-900">Active Events</p>
      <p class="text-[11px] text-gray-500">Events in progress</p>
    </div>
  </div>

  <!-- Completed Card -->
  <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex items-center gap-5">
    <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <div>
      <p class="text-2xl font-bold text-gray-900">{{ stats().completedCount }}</p>
      <p class="text-sm font-semibold text-gray-900">Completed Events</p>
      <p class="text-[11px] text-gray-500">Successfully completed</p>
    </div>
  </div>
</div>
