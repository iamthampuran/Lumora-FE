<div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 flex flex-col h-full">
  <div class="flex justify-between items-center mb-6">
    <h3 class="font-bold text-gray-900">Recent Activity</h3>
    <a href="#" class="text-[#CF6B4E] text-xs font-medium hover:underline">View all</a>
  </div>

  <!-- Activity List -->
  <div class="space-y-6 flex-1">
    @for (activity of activities; track activity.id) {
      <div class="flex gap-4">
        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 {{ activity.bgColor }} {{ activity.iconColor }}">
          <div class="w-4 h-4 bg-current rounded-sm opacity-50"></div>
        </div>
        <div class="flex-1 pb-4 border-b border-gray-50 last:border-0 last:pb-0">
          <div class="flex justify-between items-start mb-1">
            <p class="text-xs text-gray-500">{{ activity.title }}</p>
            <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2">{{ activity.time }}</span>
          </div>
          <p class="text-sm font-bold text-gray-900">{{ activity.target }}</p>
        </div>
      </div>
    }
  </div>

  <button class="w-full mt-6 py-3 border border-orange-200 text-[#CF6B4E] rounded-xl text-sm font-medium hover:bg-orange-50 transition-colors flex justify-center items-center gap-2">
    View All Activity
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
  </button>
</div>
