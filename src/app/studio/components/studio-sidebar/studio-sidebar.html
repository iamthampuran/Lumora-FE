<aside class="w-64 h-full border-r border-[#F2EDE4] bg-[#FDFBF9] flex flex-col justify-between shrink-0">
  <div>
    <!-- Top Branding / Studio Profile -->
    <div class="p-6 mb-2">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-8 h-8 rounded-full border border-orange-200 flex items-center justify-center text-[#CF6B4E] bg-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-widest text-gray-900 uppercase leading-tight">Lumora</h1>
          <p class="text-[9px] tracking-[0.2em] text-gray-400 uppercase">Stories in Focus</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gray-900 text-white flex items-center justify-center overflow-hidden shrink-0 shadow-sm">
          <img *ngIf="profileUrl()" [src]="profileUrl()" alt="Studio Logo" class="w-full h-full object-cover" />
          <span *ngIf="!profileUrl()" class="text-sm font-serif">{{ studioName().charAt(0) }}</span>
        </div>
        <div class="overflow-hidden">
          <h2 class="font-bold text-gray-900 text-sm truncate">{{ studioName() }}</h2>
          <p class="text-[11px] text-gray-500 font-medium">Studio Partner</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="px-4 space-y-1">
      <a routerLink="/studio/dashboard" routerLinkActive="bg-[#FFF5F0] text-[#CF6B4E]" [routerLinkActiveOptions]="{exact: true}" #rlaDash="routerLinkActive" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors" [ngClass]="rlaDash.isActive ? '' : 'text-gray-600 hover:bg-gray-50'">
        <svg class="w-5 h-5" [ngClass]="rlaDash.isActive ? '' : 'text-gray-400'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"></path></svg>
        Dashboard
      </a>
      <a routerLink="/studio/inquiries" routerLinkActive="bg-[#FFF5F0] text-[#CF6B4E]" #rlaInq="routerLinkActive" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors" [ngClass]="rlaInq.isActive ? '' : 'text-gray-600 hover:bg-gray-50'">
        <svg class="w-5 h-5" [ngClass]="rlaInq.isActive ? '' : 'text-gray-400'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path></svg>
        Inquiries
      </a>
      <a routerLink="/studio/galleries" routerLinkActive="bg-[#FFF5F0] text-[#CF6B4E]" #rlaGal="routerLinkActive" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors" [ngClass]="rlaGal.isActive ? '' : 'text-gray-600 hover:bg-gray-50'">
        <svg class="w-5 h-5" [ngClass]="rlaGal.isActive ? '' : 'text-gray-400'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"></path></svg>
        Galleries
      </a>
      <a routerLink="/studio/settings" routerLinkActive="bg-[#FFF5F0] text-[#CF6B4E]" #rlaSet="routerLinkActive" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors" [ngClass]="rlaSet.isActive ? '' : 'text-gray-600 hover:bg-gray-50'">
        <svg class="w-5 h-5" [ngClass]="rlaSet.isActive ? '' : 'text-gray-400'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Settings
      </a>
    </nav>
  </div>

  <!-- Bottom Actions -->
  <div class="px-4 pb-6 space-y-1">
    <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"></path></svg>
      Support
    </a>
    <button (click)="logoutUser()" [disabled]="isLoggingOut()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-gray-500">
      @if (isLoggingOut()) {
        <svg class="w-5 h-5 text-gray-400 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V2.5C6.753 2.5 2.5 6.753 2.5 12H4z"></path>
        </svg>
        Logging out...
      } @else {
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"></path></svg>
        Logout
      }
    </button>
  </div>
</aside>
