<div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  
  <section class="relative w-full h-[450px] rounded-2xl overflow-hidden shadow-lg">
    <div class="absolute inset-0">
      <img
        src="{{heroDetails?.identityResponse.coverImageUrl}}"
        alt="Cover"
        class="w-full h-full object-cover object-top"
      />
      <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/50 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
    </div>
    
    <div class="relative h-full flex flex-col justify-between p-8 md:p-12">
      
      <div>
        <button class="flex items-center text-white/90 hover:text-white text-sm font-medium transition-colors cursor-pointer">
          &larr; Back to Explore
        </button>
      </div>

      <div class="flex justify-between items-end">
        
        <div class="text-white max-w-2xl">
          <div class="flex items-center gap-5 mb-4">
            <div class="w-24 h-24 rounded-full border-2 border-white/20 bg-black/40 backdrop-blur-sm flex items-center justify-center overflow-hidden shrink-0">
              <img 
                src="{{heroDetails?.identityResponse.logoUrl}}" 
                alt="Studio Logo" 
                class="w-full h-full object-cover"
              />
            </div>

            <div>
              <h2 class="text-4xl font-serif font-medium">{{heroDetails?.identityResponse.studioName}}</h2>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mt-4">
            @for (tag of heroDetails?.tags; track $index) {
                <span class="px-4 py-1.5 rounded-xl bg-white/10 backdrop-blur-md text-sm border border-white/20 cursor-pointer">
                  {{tag.name}}
                </span>
            }
          </div>
        </div>
        
        <div class="bg-white rounded-2xl p-6 shadow-xl w-72 mb-2">
          <p class="text-sm text-gray-500 mb-1">Price Range</p>
          <p class="text-2xl font-serif text-gray-900 mb-1">₹{{heroDetails?.priceDetails.minPrice}} - ₹{{heroDetails?.priceDetails.maxPrice}}</p>
          <p class="text-sm text-gray-500 mb-6">Per Event</p>

          <button class="w-full text-white py-3 px-4 rounded-lg font-medium bg-[#CF6B4E] hover:opacity-90 transition-opacity
          cursor-pointer">
            Contact Studio
          </button>
        </div>
        
      </div>
    </div>
  </section>

</div>
