<div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8 mb-20">
  <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
    
    <h2 class="text-xl font-serif text-gray-900 mb-8 flex items-baseline gap-2">
      Recent Reviews <span class="text-sm font-sans text-gray-500 font-normal">(Latest 5)</span>
    </h2>
    
    <div class="divide-y divide-gray-100">
      
      @for (review of reviewDetails; track review.id) {
        
        <div class="py-8 first:pt-0 last:pb-0">
          
          <div class="flex flex-col md:flex-row gap-4 md:gap-6 items-start">
            
            <div 
              class="w-12 h-12 rounded-full shrink-0 flex items-center justify-center text-white font-serif text-lg"
              /* [ngClass]="review.avatarBgColor" */
              [ngClass]="getAvatarColor(review.reviewerName)"
            >
              {{ getInitial(review.reviewerName) }}
            </div>

            <div class="flex-1 grid grid-cols-1 md:grid-cols-[180px_1fr_120px] gap-4 md:gap-8">
              
              <div class="flex flex-col gap-1">
                
                <div class="flex gap-1 mb-1">
                  @for (star of starArray; track star) {
                    <svg 
                      class="w-4 h-4" 
                      [class.text-orange-400]="star <= review.rating"
                      [class.text-gray-200]="star > review.rating"
                      fill="currentColor" 
                      viewBox="0 0 20 20"
                    >
                      <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                    </svg>
                  }
                </div>
                
                @if (review.reviewerName) {
                  <span class="text-xs font-semibold text-gray-900">{{ review.reviewerName }}</span>
                }
                
                <span class="text-xs text-gray-500">{{ review.date | date: 'dd/MM/yyyy' }}</span>
              </div>

              <div class="text-sm text-gray-600 leading-relaxed">
                {{ review.comment }}
              </div>

              <div class="flex items-start justify-start md:justify-end">
                <div class="flex items-center gap-1.5 border border-green-50/0 rounded px-2 py-1 bg-green-50/50 md:bg-transparent md:p-0">
                  <svg class="w-4 h-4 text-[#CF6B4E]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path>
                  </svg>
                  <span class="text-xs font-medium md:font-normal text-gray-600 md:text-gray-500">Verified Client</span>
                </div>
              </div>

            </div>
          </div>
        </div>
      }

    </div>

    <div class="mt-10 flex justify-center border-t border-gray-100 pt-8">
      <button class="cursor-pointer px-8 py-2.5 border-2 border-[#CF6B4E] text-[#CF6B4E] rounded-lg font-medium text-sm hover:bg-[#CF6B4E] hover:text-white transition-all duration-300">
        View All Reviews
      </button>
    </div>
    
  </section>
</div>
