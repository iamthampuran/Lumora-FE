<div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  
  <div class="flex justify-between items-end mb-6">
    <h2 class="text-2xl font-serif text-gray-900">Portfolio</h2>
    
    <button class="text-[#CF6B4E] text-sm font-medium flex items-center hover:underline group">
      View Full Gallery 
      <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
    
    @for (item of portfolioDetails; track item.id; let i = $index) {
      
      <div 
        class="aspect-[4/5] rounded-xl overflow-hidden cursor-pointer group shadow-sm bg-gray-100"
        [class.hidden]="i === 4"
        [class.md:block]="i === 4"
      >
        <img 
          [src]="item.imageUrl" 
          [alt]="item.title" 
          loading="lazy"
          class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
        />
      </div>
      
    }

  </div>
</div>
